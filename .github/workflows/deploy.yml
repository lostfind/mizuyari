name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm (packageManager 버전) 과 Node 를 설치하고 lockfile 그대로 pnpm install 까지 한다
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - run: pnpm check
      - run: pnpm build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      # pnpm (packageManager 버전) 과 Node 를 설치하고 lockfile 그대로 pnpm install 까지 한다
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - run: pnpm build

      # 마이그레이션 전 복구 지점 (Time Travel 북마크) 을 로그에 남긴다
      - name: D1 time-travel bookmark
        run: pnpm exec wrangler d1 time-travel info mizuyari || true

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply mizuyari --remote

      - name: Deploy worker
        run: pnpm exec wrangler deploy
