name: Check

# PR 과 main 이외 브랜치 push 에서 타입 검사와 빌드를 돌린다.
# main 브랜치 ruleset 의 "Require status checks to pass" 에서 이 job(check) 을 지정한다.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm (packageManager 버전) 과 Node 를 설치하고 lockfile 그대로 pnpm install 까지 한다
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - run: pnpm check
      - run: pnpm build
